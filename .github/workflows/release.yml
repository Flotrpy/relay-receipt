name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - name: Test
        run: gleam test
      - name: Check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build the escript
        run: gleam run -m gleescript
      - name: Replay check
        run: scripts/replay-check.sh
      - name: Checksum
        run: sha256sum receipt > receipt.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" receipt receipt.sha256 \
            --title "Receipt $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Requires Erlang/OTP 27 or newer."
