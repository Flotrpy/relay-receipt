name = "receipt"
version = "0.1.0"
description = "Local security auditor for AI API relays"
licences = ["AGPL-3.0-only"]
repository = { type = "github", user = "Flotrpy", repo = "relay-receipt" }
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
argv = ">= 1.1.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
gleescript = ">= 1.5.2 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
