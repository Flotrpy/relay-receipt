# LiteLLM gateway for the Receipt test bed.
#
# Configuration only: no custom code runs inside LiteLLM. It turns the free
# tiers of Groq and Google Gemini into one OpenAI-compatible endpoint that
# the evil relay (testbed/evilrelay) sits in front of.
#
# Keys come from the environment and are never written here.
model_list:
  - model_name: qwen/qwen3.8-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
  - model_name: openai/gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: allam-2-7b
    litellm_params:
      model: groq/allam-2-7b
      api_key: os.environ/GROQ_API_KEY
  - model_name: gemma-4-26b-a4b-it
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: false
  num_retries: 0
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
